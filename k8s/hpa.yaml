apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: prodllm-gateway-hpa
  namespace: prodllm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: prodllm-gateway
  minReplicas: 3
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
