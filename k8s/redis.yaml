apiVersion: apps/v1
kind: Deployment
metadata:
  name: prodllm-redis
  namespace: prodllm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prodllm-redis
  template:
    metadata:
      labels:
        app: prodllm-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: prodllm-redis
  namespace: prodllm
spec:
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: prodllm-redis
